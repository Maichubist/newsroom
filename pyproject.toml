[project]
name = "newsroom"
version = "0.1.0"
description = "Autonomous multi-channel newsroom for a Ukrainian audience — stage 1a foundation."
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "telethon>=1.36",
    "openai>=1.40",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "testcontainers[postgres]>=4.8",
    # pytest-asyncio is added in M6 together with the async Telethon collector.
]
# Image decoding for the media-download pipeline (pHash). Optional: the core and
# tests use a pluggable decoder and never need this installed.
media = [
    "pillow>=10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Marker for tests that need a real Postgres (testcontainers). Pure-logic tests
# carry no marker and run with zero external dependencies.
markers = [
    "pg: test requires an ephemeral PostgreSQL container (no internet, local Docker only)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsroom*"]
