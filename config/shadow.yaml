# Критерії виходу з тіньового режиму (architecture §2). Версіоновано.
#
# Задаються ДО старту тіньового режиму. Автоматично перевіряються: обсяг і
# тривалість вибірки, жодної публікації зі стоп-листа, частка дублів нижче порогу.
# Критерій «жодного пропущеного фейку на тестовій вибірці» — людське судження на
# розміченій вибірці, його звіт лише нагадує.
version: "0.1"

min_days: 7               # мінімум днів у тіньовому режимі
min_publications: 30      # мінімум публікацій у тестовий канал
max_dup_rate: 0.15        # максимальна припустима частка дублів
dup_max_hamming: 6        # поріг simhash для «той самий матеріал»
