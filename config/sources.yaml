# Джерела для збирачів. Версіонований конфіг (architecture §6).
#
# tier: official | media | aggregator | leak | anonymous
#   official  — прямі державні/офіційні джерела (Генштаб, ОВА, міністерства). Поки немає.
#   media     — усталені редакції та новинні агенції.
#   aggregator, leak, anonymous — поки не використовуємо.
#
# ПОТРІБНЕ ТВОЄ РІШЕННЯ (Андрію): нижче для всіх виставлено tier: media як
# стартова точка. Кандидати на перекласифікацію:
#   - Укрінформ (державна агенція) і Суспільне (суспільний мовник) — можливо official/is_official.
#   - Додати офіційні держджерела (tier: official) для тем критичного ризику (хартія 3.1).
#
# Офіційні держджерела для критичних тем (хартія 3.1) майже не мають робочого RSS
# (перевірено: President 403, КМУ/НБУ/ДСНС/МЗС 404/порожньо). Вони Telegram-first,
# тож підуть як kind: telegram, коли ввімкнемо Telethon-збирач (M6):
#   Генштаб ЗСУ, Повітряні Сили, Офіс Президента, Кабмін, ДСНС, обласні ВА/ОВА.
# Робочі офіційні RSS уже додані вище: Укрінформ, Суспільне, КМДА.
#
# Приклад форми Telegram-джерела (collector flag off у 1а):
#   - name: "Генштаб ЗСУ"
#     kind: telegram
#     handle_or_url: "@generalstaff_ua"
#     origin: ua
#     tier: official
#     is_official: true
#     active: false

