# Ліміти публікацій і виявлення сплеску (architecture §10). Версіоновано.
#
# urgent_per_hour   — скільки термінових (critical) публікацій на годину;
# rumors_per_day    — скільки чуток на добу (хартія 3.7);
# surge_*           — різкий сплеск однотипних публікацій у короткому вікні —
#                     сигнал можливої інформаційної атаки, публікація притримується.
# regular_per_hour  — загальний ліміт звичайних постів на годину (firehose cap):
#                     постимо найзначиміші, решту відкладаємо; термінові (critical) і
#                     чутки не рахуються (мають власні ліміти). 0 = вимкнути.
version: "0.1"

urgent_per_hour: 6
rumors_per_day: 8
surge_window_minutes: 30
surge_max_same_rubric: 5
regular_per_hour: 8
