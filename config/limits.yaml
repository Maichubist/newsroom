# Ліміти публікацій і виявлення сплеску (architecture §10). Версіоновано.
#
# urgent_per_hour   — скільки термінових (critical) публікацій на годину;
# rumors_per_day    — скільки чуток на добу (хартія 3.7);
# surge_*           — різкий сплеск однотипних публікацій у короткому вікні —
#                     сигнал можливої інформаційної атаки, публікація притримується.
#                     Це бекстоп проти атаки, а не інструмент обсягу: що і скільки
#                     публікувати вирішує редакційна курація (editorial/curation.py),
#                     а не фіксований темп.
version: "0.1"

urgent_per_hour: 6
rumors_per_day: 8
surge_window_minutes: 30
surge_max_same_rubric: 10
regular_per_hour: 8
# Не більше одного посту на сюжет у цьому вікні (хв). Гаряча тема з багатьох джерел
# інакше спамить майже-дублями; спростування (refutation) — виняток, іде завжди.
story_cooldown_minutes: 60
