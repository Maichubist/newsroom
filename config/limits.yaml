# Ліміти публікацій і виявлення сплеску. Версіоновано.
#
# Хартія v0.3: що публікувати вирішує популярність (немає квот, рівнів значущості,
# правил чуток). Тут лишився лише анти-флуд/анти-маніпуляція бекстоп і дедуп-пейсинг:
#
# urgent_per_hour   — скільки critical публікацій на годину (запобіжник флуду);
# surge_*           — різкий сплеск однотипних публікацій у короткому вікні —
#                     сигнал можливої інформаційної атаки, публікація притримується.
version: "0.2"

urgent_per_hour: 6
surge_window_minutes: 30
surge_max_same_rubric: 10
# Не більше одного посту на сюжет у цьому вікні (хв). Гаряча тема з багатьох джерел
# інакше спамить майже-дублями; спростування (refutation) — виняток, іде завжди.
story_cooldown_minutes: 60
# Дебаунс публікації (хв): нову подію не публікуємо, доки їй не виповниться стільки
# хвилин. Близнюки з інших джерел приходять із різницею в хвилини — пауза дає їм
# прийти й злитися (dedup + story-merge) до того, як вийде перший, тож замість двох
# майже-дублів виходить один. Спростування (refutation) — виняток, іде без паузи.
publish_debounce_minutes: 6
