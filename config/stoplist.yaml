# Стоп-лист (charter §4). Перевіряється до публікації.
#
# action: block         — не публікується за жодних умов;
#         needs_official — лише після офіційного джерела і не детальніше за нього;
#         review         — у службовий чат на рішення людини (charter §10).
# scope:  all | ua_side | ru_side.
#
# ТУТ — лише ЧІТКІ, ВИСОКОТОЧНІ патерни (кожен має тести на хибні спрацювання).
# Контекстні перевірки хартії («детальніше, ніж в офіційному повідомленні»,
# розкриття українських засобів ураження, ідентифікація автора зйомки тощо) —
# на LLM-критика (1в). Обличчя/дані військовополонених — це перевірка МЕДІА
# (phash/vision), не тексту, тому тут її немає.
version: "0.2"

rules:
  - id: realtime-missile-tracking
    scope: all
    action: block
    description: "напрямки руху ракет/дронів у реальному часі — ми не моніторинговий канал (§4.2)"
    any:
      - "(?i)(ракет\\w+|шахед\\w*|бпла|дрон\\w+)\\b.{0,40}(курс(ом)?\\s+на|прямує на|у напрямку|рух\\w+ у напрямку)"

  - id: ua-airdefense-positions
    scope: ua_side
    action: block
    description: "позиції/кількість/типи ППО в конкретних місцях (§4.1)"
    any:
      - "(?i)(позиц\\w+|розташуванн\\w+|дислокац\\w+)\\s+(зенітн\\w+|ппо|засоб\\w+ ппо)"
      - "(?i)\\bппо\\b.{0,25}(поблизу|у районі|в місті|під)\\s+[А-ЯІЇЄҐ]"

  - id: ua-military-personal-data
    scope: all
    action: block
    description: "персональні дані українських військових та їхніх родин (§4.2)"
    any:
      - "(?i)(позивн\\w+).{0,40}(домашн\\w+ адрес|місце проживання|проживає|мешкає)"
      - "(?i)(домашн\\w+ адрес\\w+|місце проживання).{0,30}(військов|бійц|захисник|солдат)"

  - id: suicide-method
    scope: all
    action: review
    description: "деталі способів самогубства — за рекомендаціями ВООЗ (§8)"
    any:
      - "(?i)(спосіб|метод)\\w*\\s+(само)?губ\\w*"
      - "(?i)покінчив\\w*\\s+(із|з)\\s+життям"
