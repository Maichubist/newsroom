# Стоп-лист «AI-акценту» для критика (charter §6.1). Перевіряє ЗГЕНЕРОВАНИЙ пост
# і повертає збіги (штамп/калька/шаблон/слабкий фінал), щоб критик переписав.
# Патерни високоточні; кальки націлені саме на НЕПРАВИЛЬНУ форму (правильні
# «протягом», «брати участь», «є», «наступний», «збігатися», «захід» не тригерять).
# Тести на хибні спрацювання це стережуть (CLAUDE.md).
version: "0.2"

cliches:
  - '(?i)варто зазначити'
  - '(?i)слід підкреслити'
  - '(?i)у свою чергу'
  - '(?i)не менш важлив\w+'
  - '(?i)таким чином'
  - '(?i)це свідчить про'
  - '(?i)в умовах сьогодення'
  - '(?i)відігра\w+ ключову роль'
  - '(?i)справжн\w+ виклик'
  - '(?i)новий етап'
  - '(?i)безпрецедентн\w+'

calques:
  - '(?i)приймати участь'
  - '(?i)на протязі'
  - "(?i)(?<![\\w'])являється(?![\\w])"
  - '(?i)\bслідуючий\b'
  - '(?i)співпада\w+'
  - '(?i)міроприємств\w+'

templates:
  - '(?i)не лише[^.!?]{0,40}\bа й\b'
  - '(?i)це не просто[^.!?]{0,40},?\s+а\b'

weak_endings:
  - '(?i)час покаже'
  - '(?i)залишається лише чекати'
