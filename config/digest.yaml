# Дайджест обстрілів (docs: об'єднуємо однотипні атак-події в один пост за вікном,
# замість спаму поштучно). Версіоновано, калібрується без коду.
#
# Подія вважається «обстрілом» якщо її рубрика в rubrics І текст має маркер.
# Такі події резервуються (не публікуються поштучно) і зводяться в один пост за вікном.
version: "0.1"
timezone: "Europe/Kyiv"

rubrics: [war, strikes, defense, security]
markers:
  - "обстріл"
  - "дрон|бпла|безпілотник|шахед|geran|герань"
  - "ракет|калібр|кинджал|іскандер|balist|баліст"
  - "удар|приліт|вибух|атак|обстрілял|запуск|ціл"

# Вікна: діапазон збору (за київським часом) і час публікації дайджесту.
# night перетинає північ: публікується зранку за попередню ніч.
windows:
  - {name: "Обстріли за ніч", start_hour: 22, end_hour: 6, publish_hour: 7, publish_minute: 0}
  - {name: "Обстріли за день", start_hour: 6, end_hour: 22, publish_hour: 22, publish_minute: 30}
