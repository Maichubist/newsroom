# Дайджести (docs: однотипні, індивідуально дрібні події зводимо в один пост за
# вікном, замість спаму поштучно). Версіоновано, калібрується без коду.
#
# Подія потрапляє в категорію, якщо її рубрика (slug хребта) в rubrics І текст має
# маркер (title + факти). Маркер відбирає САМЕ рутинний підмножинок — важливе в тій
# самій рубриці (теракт-резонанс, рекорд) лишається окремим постом. Категорія без
# markers згортає всю рубрику. Перша категорія, що збіглася, виграє (порядок = пріоритет).
version: "0.2"
timezone: "Europe/Kyiv"

# Вікна: діапазон збору (київський час) + час публікації. suffix додається до назви
# категорії ("Обстріли" + "за ніч"). night перетинає північ.
windows:
  - {name: "night", suffix: "за ніч", start_hour: 22, end_hour: 6, publish_hour: 7, publish_minute: 0}
  - {name: "day",   suffix: "за день", start_hour: 6, end_hour: 22, publish_hour: 22, publish_minute: 30}

categories:
  # Обстріли/атаки — має бути ПЕРШОЮ: воєнна атака перекриває «втрати» за пріоритетом.
  - name: "Обстріли"
    hashtag: "#обстріли"
    rubrics: [war, defense, security]
    markers:
      - "обстріл"
      - "дрон|бпла|безпілотник|шахед|geran|герань"
      - "ракет|калібр|кинджал|іскандер|balist|баліст"
      - "удар|вдар|влуч|приліт|вибух|атак|обстрілял|запуск|ціл"

  # Втрати ворога — щоденні зведення втрат (рубрика war, але без атак-маркера).
  - name: "Втрати ворога"
    hashtag: "#втрати"
    rubrics: [war]
    markers:
      - "втрат"
      - "особовий склад|особового складу"
      - "ліквідов|знищено.*(окупант|солдат|загарбник)"
      - "бойові втрати|генштаб.*втрат"

  # Кримінальна хроніка — рутинний кримінал (затримання, суди, ДТП), не резонанс.
  - name: "Кримінальна хроніка"
    hashtag: "#кримінал"
    rubrics: [law_crime]
    markers:
      - "затрим|засуд|під варт|обрано запобіжн"
      - "крадіж|пограбув|шахрай|розтрат"
      - "наркотик|наркозлочин|збут"
      - "дтп|аварі|нетверез"
      - "хабар|підкуп"

  # Місцева хроніка — локальні побутові події (комуналка, пожежі, ремонти, затори).
  - name: "Місцева хроніка"
    hashtag: "#хроніка"
    rubrics: [society]
    markers:
      - "дтп|аварі"
      - "пожеж|займанн"
      - "комунальн|водопостач|електропостач|опаленн|тепло"
      - "відключенн|вимкнен|графік"
      - "ремонт|благоустр|перекрит|затор"

  # Економічні брифи — рутинна економіка (курс, тарифи, ціни, пальне).
  - name: "Економічні брифи"
    hashtag: "#економіка"
    rubrics: [economy]
    markers:
      - "курс (валют|долар|євро|гривн)|міжбанк"
      - "тариф|подорожч|подешевш|зрост.*цін|цін.*зрост"
      - "інфляц|акциз"
      - "бензин|дизель|пальн"
