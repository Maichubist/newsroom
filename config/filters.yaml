# Детермінантний фільтр сигналу (charter §2.5, §3.7.5). Версіоновано.
#
# noise -> очевидний шум/промо, дроп. ТРИМАЄМО ВУЗЬКИМ І ТОЧНИМ: за CLAUDE.md
# агресивні regex блокують легітимний контент, тож кожен патерн — високоточний,
# а тести на хибні спрацювання це стережуть. Семантичне «подія/шум» — на LLM (1в).
#
# ipso -> ІПСО-червоні-прапорці. Це МАРКЕРИ (не дроп): підвищують рівень перевірки
# на етапі верифікації (особливо у вікні охолодження чуток 3.7.5).
version: "0.3"

# air_alert -> транзитні дрон-алерти повітряної обстановки (моніторингові канали ПС ЗСУ
# тощо): «Ударний БпЛА над містом», «курсом на Одещину», «рухаються південним курсом»,
# «перебувайте в укриттях». Це буденні алерти реального часу, не новина -> дроп як шум.
# ВУЗЬКО і ТОЧНО (deny-фільтр): patterns вимагає дрон-слово ПОРУЧ (в одному реченні) із
# транзитним маркером; exclude лишає як новину все, що має наслідок (влучання/жертви/
# збиття), нічне зведення з числами, або цивільний контекст дрона (шоу/доставка/аграрне).
# Удар БЕЗ дрона (КАБи, ракети) сюди не підпадає — його ловить дайджест обстрілів.
air_alert:
  patterns:
    # дрон-слово -> (в межах речення) транзитний маркер
    - '(?is)(бпла|безпілотник\w*|\bдрон\w*|шахед\w*|герань)[^.!?\n]{0,60}(над містом|курсом|у напрямку|в напрямку|рухают\w*ся|рухаєт\w*ся|в р[\-–—]?ні|повз\s)'
    # транзитний маркер -> (в межах речення) дрон-слово
    - '(?is)(над містом|курсом на|у напрямку|в напрямку|рух\w+|в р[\-–—]?ні)[^.!?\n]{0,60}(бпла|безпілотник\w*|\bдрон\w*|шахед\w*|герань)'
    # заклик в укриття поряд із дроном (сильний алерт-маркер)
    - '(?is)(бпла|безпілотник\w*|\bдрон\w*|шахед\w*)[^.\n]{0,80}(перебувайте|прямуйте|пройдіть|негайно)\s+(в|до)\s+укритт'
  exclude:
    # наслідок -> це вже новина, лишаємо (піде далі, атаку з наслідком підбере дайджест)
    - '(?i)знешкодж|збил\w*|збит\w*|знищ\w*|подавл\w*|ліквідов\w*|перехопл\w*'
    - '(?i)постраждал\w*|загин\w*|полягл\w*|поранен\w*|жертв\w*|пошкодж\w*|руйнув\w*|уламк\w*|пожеж\w*|влуч\w*|приліт\w*'
    # нічне/денне зведення з підсумками й числами
    - '(?i)за ніч|за добу|за минул\w+ (добу|ніч)|упродовж (доби|дня|ночі|тижн\w+)|станом на|всього|загалом'
    - '(?i)\d{2,}\s*(ворож\w+ ціл|бпла|дрон|шахед|ціл)'
    # цивільний контекст дрона (не воєнний алерт)
    - '(?i)дрон[- ]?шоу|фестивал\w*|виставк\w*|презентац\w*|змаган\w*|доставк\w*|аграрн\w*|фермер\w*|обприск\w*|врожа\w*'
    # абстрактно-політичний «напрямок/курс» (не траєкторія): виробництво/реформи/інтеграція тощо
    - '(?i)виробництв\w*|розвитк\w*|реформ\w*|інтеграц\w*|незалежн\w*|співпрац\w*|партнерств\w*|експорт\w*|постачанн\w*|контракт\w*|фінансуванн\w*'

noise:
  advertising:
    - '(?i)на правах реклами'
    - '(?i)партнерськ\w+ (пост|матеріал|публікаці)'
    - '(?i)\bпромокод\b'
    - '(?i)^реклама[:\s]'
  subscribe_to_win:
    - '(?i)(підпиш\w+|підписуйт\w+).{0,60}(розігра|вигра\w+ приз|отримай\w* приз)'
  # Суспільне's daily running "N-й день війни" digest item: its TITLE crams the whole day's
  # headlines into one multi-topic string, so ingesting it as one event gives a jumbled fact
  # base and a Frankenstein post ("отримала 3,3 млрд + правила залізниці + 1668 днів"). Only
  # these digests carry the war-day counter (verified against the DB: 0 legit posts do); the
  # real single-topic events arrive from the same feed as their own items. High-precision
  # (a 3-4 digit number right before "день війни"); guarded by false-positive tests.
  war_day_digest:
    - '(?i)\b\d{3,4}[-\s]*й?\s*день\s+війни\b'

ipso:
  calls_to_share:
    - '(?i)\bпоширте\b'
    - '(?i)\bпоширюйте\b'
    - '(?i)\bперешл(іть|и|ю)\b'
    - '(?i)\bрозповсюдьте?\b'
    - '(?i)\bрозішліть\b'
    - '(?i)передай(те)?\s+(далі|всім|друзям)'
    - '(?i)\bshare (this|it)\b'
  panic_urgency:
    - '(?i)поки не видалили'
    - '(?i)терміново\s+(всім|поширте|розповсюдь)'
    - '(?i)негайно поширюйте'
  anonymous_insider:
    - '(?i)\bінсайдер\w*\b'
    - '(?i)джерел[ао]\s+в оточенні'
    - '(?i)анонімн\w+\s+джерел'
