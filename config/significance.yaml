# Поріг значущості події (T1-ворота: чи взагалі варто це постити).
#
# Детермінований бал зі стабільних сигналів (не абсолютна LLM-оцінка). Подія нижче
# `threshold` не йде в пост (журналюється low_significance). «Поставити поріг вище» =
# підняти `threshold`. Версіоновано; калібрується без коду.
#
# Бал = вага рубрики
#       + ua_bonus, якщо текст має українські маркери (UA-релевантність)
#       - foreign_penalty, якщо рубрика локально-чутлива І UA-маркерів немає
#       + підтвердження джерелами (corroboration)
#       + story_bonus, якщо подія в сюжеті, що розвивається.
# critical рахується за суттю (окремого floor немає); офіційність — окремі ворота ризику.
version: "0.1"

# Дешевий пре-фільтр — головний суддя шуму це РАНКЕР курації (editorial/curation.py),
# який тепер суворіший. Поріг делікатно піднято 0.55→0.60 (ріже нішу й дрібне впевненіше,
# лишає tech/UA-спорт на ~0.60). Локальне/рутинне (регіональна хроніка, ДТП, дрібні суди —
# бали ~0.77 через UA-бонус) цей поріг НЕ ріже; це робить ранкер. Підняти ще — тут або,
# точніше, у промпті ранкера. Калібрується без коду.
threshold: 0.60
ua_bonus: 0.25
foreign_penalty: 0.30      # лише для locality_sensitive рубрик без UA-маркерів
corroboration_step: 0.08   # за кожне незалежне джерело понад перше
corroboration_cap: 0.16
# Хронічна тема (щоденні дрони/обстріли — важливо, але для масового читача буденність
# роками) знижується. Хронічна = багато подій за ДОВГИЙ проміжок; свіжий сплеск/
# ескалація (багато подій за короткий час) — НЕ хронічна.
routine_penalty: 0.20
routine_min_events: 8      # тема має щонайменше стільки подій...
routine_min_days: 4        # ...розтягнутих щонайменше на стільки днів = хронічна
# critical_floor ПРИБРАНО: війна/оборона/удари рахуються за суттю, як усе інше (контент-
# фрі алерт «⚠ Одеса» більше не автопроходить). Кожна подія заробляє прохід через поріг і
# оцінюється редакційним ранкером; офіційність джерела — окремі ворота ризику (gate.py).

# Вага рубрики (значущість) + locality_sensitive (чи вішати іноземний штраф).
# Глобальні теми (війна, геополітика, економіка, tech, science) — foreign-нейтральні,
# щоб важлива іноземна подія (Іран—США, запуск iPhone) лишалася. Локальні (спорт,
# суспільство, лайфстайл, культура) отримують штраф за відсутність зв'язку з Україною.
default_weight: 0.50
default_locality_sensitive: true
rubrics:
  war:          {weight: 0.90, locality_sensitive: false}
  defense:      {weight: 0.90, locality_sensitive: false}
  security:     {weight: 0.85, locality_sensitive: false}
  strikes:      {weight: 0.90, locality_sensitive: false}
  politics:     {weight: 0.80, locality_sensitive: false}
  economy:      {weight: 0.72, locality_sensitive: false}
  corruption:   {weight: 0.72, locality_sensitive: true}
  mobilization: {weight: 0.75, locality_sensitive: true}
  accusations:  {weight: 0.58, locality_sensitive: true}
  crime:        {weight: 0.50, locality_sensitive: true}
  society:      {weight: 0.52, locality_sensitive: true}
  technology:   {weight: 0.60, locality_sensitive: false}
  science:      {weight: 0.55, locality_sensitive: false}
  culture:      {weight: 0.40, locality_sensitive: true}
  sport:        {weight: 0.35, locality_sensitive: true}
  lifestyle:    {weight: 0.28, locality_sensitive: true}

# Українські маркери (регістронезалежно). Наявність будь-якого = UA-релевантність.
# Це позитивний сигнал (бонус), не deny-фільтр: пропуск маркера лише знижує бал.
# Стеми враховують укр. відмінювання й чергування і/о в корені (Львів→Львові,
# Київ→Києві), тому для таких міст додано і «о»-корінь.
ua_markers:
  - "україн"
  - "київ|києв|львів|львов|харків|харков|одес|дніпр|запоріж|миколаїв|миколаєв|херсон|полтав|вінниц|чернігів|чернігов|черкас|суми|сум|житомир|ужгород|івано-франків|тернопіл|тернопол|луцьк|рівне|рівн|хмельницьк|кропивницьк|маріупол|краматорськ|бахмут|покровськ|мелітопол|бердянськ"
  - "зеленськ|залужн|сирськ|єрмак|шмигаль|стефанчук|порошенк|кличк"
  - "зсу|тцк|снбо|верховн(а|ої) рад|кабмін|нбу|укрзалізниц|укрпошт|дснс"
  - "гривн|гривень"
  - "шахтар|динамо київ|динамо києв|збірн(а|ої) україни"
  - "окупант|деокупац|обстріл|сил(и|) оборони"
  # Латиниця/німецькі форми — щоб новини про Україну із зарубіжних видань (Fox, NYT,
  # BBC, Spiegel, Tagesschau…) теж рахувались UA-релевантними (позитивний бонус).
  - "ukrain|zelens|selensk|kyiv|kiew|kharkiv|charkiw|kharkov|odes|donetsk|donezk|luhansk|lugansk|zaporizh|saporisch|kherson|cherson|mariupol|crimea|donbas|azov"
